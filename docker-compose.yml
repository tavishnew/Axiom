version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: axiom-postgres
    environment:
      POSTGRES_DB: axiom
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d axiom"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: